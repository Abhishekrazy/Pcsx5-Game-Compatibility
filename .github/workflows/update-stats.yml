name: Update Compatibility Stats

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:      # Manual trigger
  issues:
    types: [opened, closed, labeled, unlabeled, reopened]

permissions:
  contents: write
  issues: read

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch issue statistics
        id: stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python << 'EOF'
          # Stdlib only - no pip install, so nothing to cache or fetch.
          import os, json, urllib.request, urllib.parse

          repo = os.environ['REPO']
          token = os.environ['GITHUB_TOKEN']
          labels = {
              'status-playable': 'Playable',
              'status-ingame': 'In-Game',
              'status-menus': 'Menus',
              'status-boots': 'Boots',
              'status-nothing': 'Nothing',
          }

          def count(label):
              q = urllib.parse.quote(f'repo:{repo} label:"{label}"')
              url = f'https://api.github.com/search/issues?q={q}&per_page=1'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'token {token}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'pcsx5-compat-stats',
              })
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)['total_count']

          stats, total = {}, 0
          for label, name in labels.items():
              c = count(label)
              stats[name] = c
              total += c
              print(f'{name}: {c}')
          print(f'Total: {total}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'stats={json.dumps(stats)}\n')
              f.write(f'total={total}\n')
          EOF

      - name: Update README with stats
        if: steps.stats.outputs.stats != ''
        run: |
          python << 'EOF'
          import os
          import json
          import re
          from datetime import datetime

          stats = json.loads(os.environ['STATS_JSON'])
          total = int(os.environ['TOTAL'])

          with open('README.md', 'r') as f:
              content = f.read()

          # Update the stats table
          table_lines = []
          for status, count in stats.items():
              pct = (count / total * 100) if total > 0 else 0
              color_map = {
                  'Playable': '0e8a16',
                  'In-Game': 'fbca04',
                  'Menus': 'f9d0c4',
                  'Boots': 'd4c5f9',
                  'Nothing': 'ededed'
              }
              color = color_map.get(status, 'ededed')
              badge = f'![{status}](https://img.shields.io/badge/{status.replace(" ", "%20")}-{count}-{color}?style=flat-square)'
              table_lines.append(f'| {badge} | {count} | {pct:.1f}% |')

          new_table = '\n'.join(table_lines)
          new_table += f'\n| **Total** | **{total}** | **100%** |'

          # Replace the whole table body (all rows after the header/separator,
          # including any Total rows) so runs cannot duplicate the Total line.
          pattern = r'(\| Status \| Count \| Percentage \|\n\|[-|]+\|\n)(?:\|[^\n]*\n)*'
          content = re.sub(pattern, lambda m: m.group(1) + new_table + '\n', content)

          # Update last updated date
          content = re.sub(
              r'> 📈 \*Last updated:[^\n]*',
              f'> 📈 *Last updated: {datetime.utcnow().strftime("%Y-%m-%d")} • [Refresh stats](https://github.com/{os.environ["REPO"]}/actions/workflows/update-stats.yml)*',
              content
          )

          with open('README.md', 'w') as f:
              f.write(content)

          print('README updated successfully')
        env:
          STATS_JSON: ${{ steps.stats.outputs.stats }}
          TOTAL: ${{ steps.stats.outputs.total }}
          REPO: ${{ github.repository }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update compatibility stats [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
